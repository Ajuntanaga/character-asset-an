name: Native surface groom reconstruction
on:
  workflow_dispatch:
    inputs:
      textured:
        description: Render native photo skin and groom appearance
        type: boolean
        default: false
      expressions:
        description: Render rest, jaw, blink and brow deformation comparisons
        type: boolean
        default: false
      albedo:
        description: Render unlit skin base color to diagnose texture versus lighting
        type: boolean
        default: false
      clean_albedo:
        description: Compare separate cleaned skin atlas trial
        type: boolean
        default: false
      undercoat:
        description: Render isolated undercoat and curl comparisons
        type: boolean
        default: false
      undercoat_feather_mm:
        description: Undercoat hairline fade width in mm (0 disables trial)
        type: choice
        options: ['0', '4', '6']
        default: '0'
permissions:
  contents: write
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  face:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UNDERCOAT_FEATHER_MM: ${{ inputs.undercoat_feather_mm || '0' }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Download isolated native face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download checkpoint-v739 --pattern V739_native_face_trial.blend
          echo '63f795279e1c0ce770ba7238619c276a4ec0e2f2c5d3afca8a829981916dce21  V739_native_face_trial.blend' | sha256sum -c -
      - name: Download native photo texture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download checkpoint-v739 --pattern Character_An_photoreal_head_basecolor_v326.png
          echo 'aa09646354554ea5c634dcbaa1083367894addc067784de6174c76e4dc1691fd  Character_An_photoreal_head_basecolor_v326.png' | sha256sum -c -
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build and preserve native groom
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec V739_native_face_trial.blend --threads 2 --python-exit-code 1 --python pipeline/build_v740_cloud_groom.py
      - name: Bind brows and beard to native facial keys
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/build_v740_cloud_facial_fibers.py
      - uses: actions/upload-artifact@v4
        id: artifact_1
        continue-on-error: true
        if: always()
        with:
          name: native-groom-checkpoint
          path: results/V740_cloud_groom_trial.blend
          retention-days: 7
      - name: Render scalp shape and coverage
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_cloud_groom.py
      - name: Publish scalp previews immediately
        uses: actions/upload-artifact@v4
        id: artifact_2
        continue-on-error: true
        with:
          name: native-groom-scalp-preview
          path: |
            results/*.json
            results/renders/*.png
          retention-days: 7
      - name: Render native photo skin
        if: ${{ inputs.textured }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_textured.py
      - name: Publish textured previews immediately
        if: ${{ inputs.textured }}
        uses: actions/upload-artifact@v4
        id: artifact_3
        continue-on-error: true
        with:
          name: native-groom-textured-preview
          path: |
            results/*.json
            results/renders/*.png
          retention-days: 7
      - name: Render isolated hair layers
        if: ${{ inputs.undercoat }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_undercoat.py
      - name: Render cleaned atlas comparison
        if: ${{ inputs.clean_albedo }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v741_clean_albedo.py
      - name: Render unlit skin diagnostic
        if: ${{ inputs.albedo }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_albedo.py
      - name: Publish appearance previews before expression tests
        if: ${{ inputs.expressions }}
        uses: actions/upload-artifact@v4
        id: artifact_4
        continue-on-error: true
        with:
          name: native-groom-appearance
          path: |
            results/*.json
            results/renders/*.png
          retention-days: 7
      - name: Render expression comparisons
        if: ${{ inputs.expressions }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_deformation.py
      - uses: actions/upload-artifact@v4
        id: artifact_5
        continue-on-error: true
        if: always()
        with:
          name: native-surface-groom
          path: |
            results/*.json
            results/renders/*.png
          retention-days: 7
      - name: Preserve outputs when Actions artifact storage is unavailable
        if: ${{ always() && !cancelled() && (steps.artifact_1.outcome == 'failure' || steps.artifact_2.outcome == 'failure' || steps.artifact_3.outcome == 'failure' || steps.artifact_4.outcome == 'failure' || steps.artifact_5.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          files = [p for p in Path('results').rglob('*') if p.is_file() and p.suffix in ('.png', '.json', '.zst', '.blend')]
          assert files, 'No outputs available to preserve'
          with tarfile.open('cloud-results.tar.gz', 'w:gz', compresslevel=1) as archive:
              for path in sorted(files):
                  archive.add(path, arcname=str(path))
          with tarfile.open('cloud-previews.tar.gz', 'w:gz', compresslevel=1) as archive:
              for path in sorted(files):
                  if path.suffix in ('.png', '.json'):
                      archive.add(path, arcname=str(path))
          PY
          tag="cloud-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" cloud-results.tar.gz cloud-previews.tar.gz --target "$GITHUB_SHA" --draft --title "Cloud results ${GITHUB_RUN_ID}" --notes "Fallback archive after Actions artifact upload failure. Trial outputs, not an accepted production checkpoint."
