name: Preserve surface groom checkpoint
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful visually reviewed V775, V776 or V777 groom build
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve compact scenes and actual previews
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$SOURCE_RUN" --json conclusion --jq .conclusion)" = success
          case "$(gh run view "$SOURCE_RUN" --json workflowName --jq .workflowName)" in
            'Refine character scalp surface coverage')
              artifact=surface-scalp; version=v775; scene=V775_surface_scalp_trial.blend ;;
            'Refine character mustache density')
              artifact=mustache-density; version=v776; scene=V776_mustache_trial.blend ;;
            'Compare character scalp hair scattering')
              artifact=scalp-huang; version=v777; scene=V777_scalp_huang_trial.blend ;;
            *) echo 'Unsupported source workflow' >&2; exit 1 ;;
          esac
          gh run download "$SOURCE_RUN" --name "$artifact-checkpoint" --dir trial
          gh run download "$SOURCE_RUN" --name "$artifact-preview" --dir preview
          mkdir release
          cp "trial/$scene" release/
          cp preview/renders/"$version"*.png preview/"$version"*.json release/
          cp licenses/hair-asset-sources.md release/
          cp github_assets/v767/README.md release/albedo-provenance.md
          target=$(gh run view "$SOURCE_RUN" --json headSha --jq .headSha)
          cd release
          sha256sum -- * > SHA256SUMS
          gh release create "surface-groom-$SOURCE_RUN" ./* --target "$target" --prerelease \
            --title "Surface groom working checkpoint $SOURCE_RUN" \
            --notes "$version reviewed working groom checkpoint. Actual Blender previews, reports and attribution included. Shape keys and rig drivers retained. This is a working checkpoint; likeness, scalp coverage, neck transition and full animation validation remain unfinished."
