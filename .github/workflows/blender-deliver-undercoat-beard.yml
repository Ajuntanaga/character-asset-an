name: Preserve undercoat and beard checkpoints
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful visually reviewed undercoat and beard build
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve compact scenes and actual previews
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$SOURCE_RUN" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_RUN" --json workflowName --jq .workflowName)" = 'Refine character undercoat and beard'
          gh run download "$SOURCE_RUN" --name undercoat-beard-checkpoints --dir trial
          gh run download "$SOURCE_RUN" --name undercoat-beard-preview --dir preview
          mkdir release
          cp trial/V771_short_undercoat_trial.blend trial/V772_feathered_beard_trial.blend release/
          cp preview/renders/v771*.png preview/renders/v772*.png preview/v771*.json preview/v772*.json release/
          cp licenses/hair-asset-sources.md release/
          cp github_assets/v767/README.md release/albedo-provenance.md
          target=$(gh run view "$SOURCE_RUN" --json headSha --jq .headSha)
          cd release
          sha256sum -- * > SHA256SUMS
          gh release create "undercoat-beard-$SOURCE_RUN" ./* --target "$target" --prerelease \
            --title "Undercoat and beard working checkpoints $SOURCE_RUN" \
            --notes "V771 short curl undercoat and V772 feathered beard trials, actual Blender previews, build reports, and attribution. Shape keys and rig drivers retained. These are working checkpoints; likeness, crown shape, neck seam and full animation validation remain unfinished."
