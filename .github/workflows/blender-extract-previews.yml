name: Extract existing Blender previews
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing cloud-results release containing cloud-results.tar.gz
        required: true
        type: string
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Extract preview images and reports without loading Blender
        run: |
          [[ "$RELEASE_TAG" =~ ^cloud-results-[0-9]+-[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --pattern cloud-results.tar.gz
          python3 - <<'PY'
          import pathlib, tarfile
          root = pathlib.Path('previews').resolve()
          root.mkdir()
          with tarfile.open('cloud-results.tar.gz', 'r:gz') as archive:
              for member in archive:
                  if not member.isfile() or pathlib.Path(member.name).suffix.lower() not in {'.png', '.json'}:
                      continue
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe archive path')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as source, target.open('wb') as dest:
                      import shutil
                      shutil.copyfileobj(source, dest, 1024 * 1024)
          if not any(root.rglob('*.png')):
              raise RuntimeError('No preview images found')
          PY
          tar -C previews -czf cloud-previews.tar.gz .
          gh release upload "$RELEASE_TAG" cloud-previews.tar.gz
