name: Native smile fit diagnostic
on:
  workflow_dispatch:
    inputs:
      render_eyelid_albedo:
        type: boolean
        default: false
      render_blink_surface:
        type: boolean
        default: false
      render_eye_comparison:
        type: boolean
        default: false
      render_eye_fit:
        type: boolean
        default: false
      trial_smile_corner:
        type: boolean
        default: false
      render_skin_normals:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  smile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Reuse completed native face checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 43418752707 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download 43418752707 --repo "$GITHUB_REPOSITORY" --name native-groom-checkpoint --dir checkpoint
          test -s checkpoint/V740_cloud_groom_trial.blend
      - name: Download pinned skin atlas for eye comparison
        if: inputs.render_eyelid_albedo || inputs.render_blink_surface || inputs.render_eye_comparison || inputs.render_eye_fit || inputs.render_skin_normals || inputs.trial_smile_corner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download checkpoint-v739 --repo "$GITHUB_REPOSITORY" --pattern Character_An_photoreal_head_basecolor_v326.png
          echo 'aa09646354554ea5c634dcbaa1083367894addc067784de6174c76e4dc1691fd  Character_An_photoreal_head_basecolor_v326.png' | sha256sum -c -
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Compare fitted and reconstructed donor smile
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/diagnose_v740_smile.py
      - name: Inspect native blink boundary and drivers
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/diagnose_v740_blink.py
      - name: Compare eyelid atlas at rest and blink
        if: inputs.render_eyelid_albedo
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v745_eyelid_albedo.py
      - name: Isolate closed eyelid surface
        if: inputs.render_blink_surface
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v744_blink_surface.py
      - name: Separate skin texture from eye geometry
        if: inputs.render_eye_comparison
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_eye_texture.py
      - name: Compare eye fit allowance at rest and blink
        if: inputs.render_eye_fit
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_eye_fit.py
      - name: Compare skin normal shading
        if: inputs.render_skin_normals
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_skin_normals.py
      - name: Compare localized smile correction
        if: inputs.trial_smile_corner
        run: |
          cp results/smile_surface_diagnostic.json results/v743_smile_baseline.json
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec checkpoint/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/trial_v743_smile_corner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smile-fit-diagnostic
          path: |
            results/smile_surface_diagnostic.json
            results/blink_boundary_diagnostic.json
            results/renders/v745_eyelid_*.png
            results/v745_eyelid_*_render_report.json
            results/renders/v744_blink_surface_*.png
            results/skin_normal_comparison.json
            results/renders/v740_skin_*.png
            results/renders/v740_eye_texture_*.png
            results/renders/v740_eye_fit_*.png
            results/eye_fit_comparison.json
            results/v743_smile_*.json
            results/renders/v743_smile_*.png
          if-no-files-found: error
          retention-days: 7
