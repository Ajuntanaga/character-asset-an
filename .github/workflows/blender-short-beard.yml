name: Compare character short beard
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  beard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: /tmp/blender-5.2.2-linux-x64
          key: blender-linux-5.2.2-84098912789d
      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Fetch checkpoint and licensed curls on runner
        run: |
          mkdir -p results assets/licensed-hair-library
          curl --fail --location --retry 2 -o results/source.blend https://github.com/Ajuntanaga/character-asset-an/releases/download/temple-groom-43800076042/V779_temple_coverage_trial.blend
          echo '1a6b31454c8e9156d6d706f23938759c8b1408793d326ae73ae87fa51c1fbcac  results/source.blend' | sha256sum -c -
          curl --fail --location --retry 2 -o /tmp/licensed-hair.tar.gz https://github.com/Ajuntanaga/character-asset-an/releases/download/licensed-hair-43770919141/licensed-hair-library.tar.gz
          echo '1d0c18fa0be2f16bada50d3f0edfc8cbf59e1ec1449d9388e4ddd3ba8a244c03  /tmp/licensed-hair.tar.gz' | sha256sum -c -
          tar -xzf /tmp/licensed-hair.tar.gz -C assets/licensed-hair-library --strip-components=1
          test -f assets/licensed-hair-library/bystedt_curls.npz
      - name: Rebuild accepted crown and shader, then test fuller short beard
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/source.blend --threads 2 --python-exit-code 1 --python-expr "import runpy; runpy.run_path('pipeline/build_v782_scalp_fill.py', init_globals={'RENDER': False}); runpy.run_path('pipeline/build_v784_crown_mix.py', init_globals={'RENDER': False}); runpy.run_path('pipeline/build_v786_facial_hair_shading.py', init_globals={'RENDER': False}); runpy.run_path('pipeline/build_v787_short_beard.py')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-beard-preview
          path: |
            results/v787*.json
            results/renders/v787*.png
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: short-beard-checkpoint
          path: results/V787_short_beard_trial.blend
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
