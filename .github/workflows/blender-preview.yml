name: Blender scene check and preview
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded scene check, CPU preview, isolated correction, or combined trial
        type: choice
        options: [check, preview, review, build-review, hand-build, groom-build, blink-build, guitar-build, combined-build]
        default: check
      axial_trial:
        description: V642 axial fit including middle MCP roll and V637 hover treatment
        type: boolean
        default: false
      wrist_extension:
        description: Isolated connected wrist extension with hand-build
        type: boolean
        default: false
      cuff_variant:
        description: Isolated left cuff trial with hand build
        type: choice
        options: [baseline, distance-weighted, wrist-fitted, sleeve-masked, forearm-directed, sleeve-panel]
        default: baseline
      facial_hair:
        description: Include the reversible beard-length trial with blink-build
        type: boolean
        default: false
      delit_face:
        description: Test the lower-resolution de-lit albedo with combined-build
        type: boolean
        default: false
      groom_variant:
        description: Optional separated curl subclump trial
        type: choice
        options: [baseline, separated, staggered, compact]
        default: baseline
      eye_aperture_variant:
        description: Isolated eyelid contour trial with portrait and blink review
        type: choice
        options: [baseline, narrow-upper, rounded-lower]
        default: baseline
      maple_variant:
        description: Isolated finer maple albedo comparison; existing finish remains default
        type: choice
        options: [baseline, fine-flame, restrained]
        default: baseline
      continuous_body:
        description: Reversible continuous guitar body edge trial
        type: boolean
        default: false
      review_scope:
        description: Full review, portrait with blinks, appearance, mouth, wardrobe, hands, or hair layer isolation
        type: choice
        options: [full, mouth, appearance, portrait, hands, wardrobe, hair-layers]
        default: full
permissions:
  contents: write
  actions: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MODE: ${{ inputs.mode }}
      AXIAL_TRIAL: ${{ inputs.axial_trial }}
      CUFF_VARIANT: ${{ inputs.cuff_variant }}
      WRIST_EXTENSION: ${{ inputs.wrist_extension }}
      FACIAL_HAIR: ${{ inputs.facial_hair }}
      DELIT_FACE: ${{ inputs.delit_face }}
      REVIEW_SCOPE: ${{ inputs.review_scope }}
      MAPLE_VARIANT: ${{ inputs.maple_variant }}
      CONTINUOUS_BODY: ${{ inputs.continuous_body }}
      GROOM_VARIANT: ${{ inputs.groom_variant }}
      EYE_APERTURE_VARIANT: ${{ inputs.eye_aperture_variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scenes results
          gh release download checkpoint-v528 --pattern current-v528.blend --dir scenes
          gh release download checkpoint-v543 --pattern current-v543.delta.zst --dir scenes
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(pathlib.Path('github_assets/scene-manifest.json').read_text())
          for name in ('current-v528.blend', 'current-v543.delta.zst'):
              with pathlib.Path('scenes',name).open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
              assert actual == manifest[name]['sha256'], (name, actual)
          PY
          zstd -d -M1024MB --patch-from=scenes/current-v528.blend scenes/current-v543.delta.zst -o scenes/current-v543.blend
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scenes/current-v543.blend')
          expected=json.loads(pathlib.Path('github_assets/scene-manifest.json').read_text())['current-v543.blend']['sha256']
          with p.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual == expected, (actual, expected)
          PY
          scene=current-v543.blend
          if [ "$MODE" != build-review ]; then
            gh release download checkpoint-v544 --pattern current-v544.delta.zst --dir scenes
            python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scenes/current-v544.delta.zst')
          expected=json.loads(pathlib.Path('github_assets/scene-manifest.json').read_text())[p.name]['sha256']
          with p.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual == expected, (actual, expected)
          PY
            zstd -d -M1024MB --patch-from=scenes/current-v543.blend scenes/current-v544.delta.zst -o scenes/current-v544.blend
            python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scenes/current-v544.blend')
          expected=json.loads(pathlib.Path('github_assets/scene-manifest.json').read_text())[p.name]['sha256']
          with p.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual == expected, (actual, expected)
          PY
            scene=current-v544.blend
          fi
          echo "SCENE=$scene" >> "$GITHUB_ENV"
          if [ "$MODE" = hand-build ]; then
            gh release download checkpoint-v528 --pattern native-hand-v522.blend --dir scenes
            python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scenes/native-hand-v522.blend')
          expected=json.loads(pathlib.Path('github_assets/scene-manifest.json').read_text())[p.name]['sha256']
          with p.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual == expected, (actual, expected)
          PY
          fi
      - name: Reuse pinned hand fit for cuff-only trial
        if: inputs.mode == 'hand-build' && (inputs.cuff_variant == 'wrist-fitted' || inputs.cuff_variant == 'sleeve-masked' || inputs.cuff_variant == 'forearm-directed' || inputs.cuff_variant == 'sleeve-panel')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$AXIAL_TRIAL" = true && test "$WRIST_EXTENSION" != true
          gh run download 43428473700 -n blender-hand-build-86 -D scenes/hand-checkpoint
          gh run download 43428473700 -n previews-hand-build-86 -D scenes/hand-previews
          echo '7a7b0f179ee17cf498e0298345030238ca36e8c4d6764c62413f4eead90302ab  scenes/hand-checkpoint/current-v545.delta.zst' | sha256sum -c -
          zstd -d -M1024MB --patch-from=scenes/current-v544.blend scenes/hand-checkpoint/current-v545.delta.zst -o scenes/reused-hand.blend
          echo '2280c5107d38cd0941d0c6332de745feeeb28404e2354d08db51b1da45e1bdb8  scenes/reused-hand.blend' | sha256sum -c -
          cp scenes/hand-previews/hand-fit-report.json results/
          echo '{"source_run":43428473700,"status":"UNPROMOTED_HAND_FIT_REUSED_FOR_CUFF_ONLY"}' > results/hand-reuse.json
          echo 'SCENE=reused-hand.blend' >> "$GITHUB_ENV"
          echo 'REUSE_HAND=true' >> "$GITHUB_ENV"
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Check scene and optionally render
        run: |
          extra=()
          if [ "${REUSE_HAND:-false}" = true ]; then extra+=(--reuse-hand); fi
          if [ "$AXIAL_TRIAL" = true ]; then extra+=(--axial-trial); fi
          if [ "$WRIST_EXTENSION" = true ]; then extra+=(--wrist-extension); fi
          if [ "$FACIAL_HAIR" = true ]; then extra+=(--facial-hair); fi
          if [ "$DELIT_FACE" = true ]; then extra+=(--delit-face); fi
          extra+=(--review-scope "${REVIEW_SCOPE:-full}")
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec "scenes/$SCENE" --threads 2 --python-exit-code 1 --python pipeline/github_scene_job.py -- --mode "$MODE" --output results "${extra[@]}"
      - uses: actions/upload-artifact@v4
        id: artifact_1
        continue-on-error: true
        if: always()
        with:
          name: previews-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            results/*.png
            results/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Package built scene as a checked delta
        if: inputs.mode == 'build-review'
        run: |
          zstd -T2 --patch-from=scenes/current-v543.blend results/Character_An_reference_revision_TRIAL_v544.blend -o results/current-v544.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v543.blend'), pathlib.Path('results/current-v544.delta.zst'), pathlib.Path('results/Character_An_reference_revision_TRIAL_v544.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Package fretting-hand scene as a checked delta
        if: inputs.mode == 'hand-build'
        run: |
          zstd -T2 --patch-from=scenes/current-v544.blend results/Character_An_fretting_hand_TRIAL_v545.blend -o results/current-v545.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v544.blend'), pathlib.Path('results/current-v545.delta.zst'), pathlib.Path('results/Character_An_fretting_hand_TRIAL_v545.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Package groom scene as a checked delta
        if: inputs.mode == 'groom-build'
        run: |
          zstd -T2 --patch-from=scenes/current-v544.blend results/Character_An_coherent_groom_TRIAL_v546.blend -o results/current-v546.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v544.blend'), pathlib.Path('results/current-v546.delta.zst'), pathlib.Path('results/Character_An_coherent_groom_TRIAL_v546.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Package blink scene as a checked delta
        if: inputs.mode == 'blink-build'
        run: |
          zstd -T2 --patch-from=scenes/current-v544.blend results/Character_An_blink_alignment_TRIAL_v547.blend -o results/current-v547.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v544.blend'), pathlib.Path('results/current-v547.delta.zst'), pathlib.Path('results/Character_An_blink_alignment_TRIAL_v547.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Package guitar scene as a checked delta
        if: inputs.mode == 'guitar-build'
        run: |
          zstd -T2 --patch-from=scenes/current-v544.blend results/Character_An_maple_density_TRIAL_v550.blend -o results/current-v550.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v544.blend'), pathlib.Path('results/current-v550.delta.zst'), pathlib.Path('results/Character_An_maple_density_TRIAL_v550.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Package combined scene as a checked delta
        if: inputs.mode == 'combined-build'
        run: |
          zstd -T2 --patch-from=scenes/current-v544.blend results/Character_An_combined_reference_TRIAL_v554.blend -o results/current-v554.delta.zst
          python3 - <<'PY'
          import hashlib,json,pathlib
          files = [pathlib.Path('scenes/current-v544.blend'), pathlib.Path('results/current-v554.delta.zst'), pathlib.Path('results/Character_An_combined_reference_TRIAL_v554.blend')]
          manifest = {}
          for p in files:
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              manifest[p.name] = {'sha256': digest, 'bytes': p.stat().st_size}
          pathlib.Path('results/build-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        id: artifact_2
        continue-on-error: true
        if: always()
        with:
          name: blender-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            results/build-manifest.json
            results/*.zst
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve outputs when Actions artifact storage is unavailable
        if: ${{ always() && !cancelled() && (steps.artifact_1.outcome == 'failure' || steps.artifact_2.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          files = [p for p in Path('results').rglob('*') if p.is_file() and p.suffix in ('.png', '.json', '.zst')]
          assert files, 'No outputs available to preserve'
          with tarfile.open('cloud-results.tar.gz', 'w:gz', compresslevel=1) as archive:
              for path in sorted(files):
                  archive.add(path, arcname=str(path))
          with tarfile.open('cloud-previews.tar.gz', 'w:gz', compresslevel=1) as archive:
              for path in sorted(files):
                  if path.suffix in ('.png', '.json'):
                      archive.add(path, arcname=str(path))
          PY
          tag="cloud-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" cloud-results.tar.gz cloud-previews.tar.gz --target "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" --draft --title "Cloud results ${GITHUB_RUN_ID}" --notes "Fallback archive after Actions artifact upload failure. Source commit: ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The release tag tracks the default branch for delivery only; it is not the source revision. Trial outputs, not an accepted production checkpoint."
