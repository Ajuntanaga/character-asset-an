name: Review character scalp layers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  scalp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: /tmp/blender-5.2.2-linux-x64
          key: blender-linux-5.2.2-84098912789d
      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Fetch accepted checkpoint on runner
        run: |
          mkdir -p results
          curl --fail --location --retry 2 -o results/source.blend https://github.com/Ajuntanaga/character-asset-an/releases/download/temple-groom-43800076042/V779_temple_coverage_trial.blend
          echo '1a6b31454c8e9156d6d706f23938759c8b1408793d326ae73ae87fa51c1fbcac  results/source.blend' | sha256sum -c -
      - name: Render three matching scalp crops
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/source.blend --threads 2 --python-exit-code 1 --python pipeline/render_v781_groom_layers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalp-layer-previews
          path: |
            results/v781_layer_review.json
            results/renders/v781*.png
          retention-days: 14
          if-no-files-found: error
