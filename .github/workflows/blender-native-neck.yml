name: Native checkpoint review
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful native groom run containing native-groom-checkpoint
        type: string
        required: true
        default: '43658546515'
      review:
        description: Review an existing checkpoint without rebuilding the groom
        type: choice
        options: [neck-motion, skin-albedo, skin-calibration, body-join, projection, hair-shader, fitted-camera, eyelids, groom-refinement]
        default: neck-motion
permissions:
  contents: read
  actions: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  neck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Download existing groom checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name native-groom-checkpoint --dir results
          test -f results/V740_cloud_groom_trial.blend
      - name: Download corrected wardrobe body
        if: ${{ inputs.review == 'body-join' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scenes results
          gh release download checkpoint-v758-wardrobe --pattern V585_wardrobe_body.blend --dir scenes
          echo 'b435cb2456b1f6fb1548e37fc85ebf660730f96c14f59a035d74b86e16b0dc5e  scenes/V585_wardrobe_body.blend' | sha256sum -c -
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Download photo for skin review
        if: ${{ inputs.review == 'skin-albedo' || inputs.review == 'skin-calibration' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download checkpoint-v739 --pattern Character_An_photoreal_head_basecolor_v326.png
          echo 'aa09646354554ea5c634dcbaa1083367894addc067784de6174c76e4dc1691fd  Character_An_photoreal_head_basecolor_v326.png' | sha256sum -c -
      - name: Render unlit skin diagnostic
        if: ${{ inputs.review == 'skin-albedo' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v740_albedo.py
      - name: Calibrate procedural skin and render comparison
        if: ${{ inputs.review == 'skin-calibration' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/calibrate_v756_neck_albedo.py
      - name: Compare orthographic and perspective framing
        if: ${{ inputs.review == 'projection' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v759_projection_comparison.py
      - name: Render donor-correspondence fitted camera
        if: ${{ inputs.review == 'fitted-camera' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v761_fitted_camera.py
      - name: Compare partial native eyelid closure
        if: ${{ inputs.review == 'eyelids' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v762_eyelid_comparison.py
      - name: Compare hair highlight width with fixed geometry
        if: ${{ inputs.review == 'hair-shader' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v760_hair_shader_comparison.py
      - name: Compare original groom with finer dark fibers
        if: ${{ inputs.review == 'groom-refinement' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v762_groom_refinement.py
      - name: Bind neck without altering facial keys
        if: ${{ inputs.review == 'neck-motion' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/build_v755_neck_skinning_trial.py
      - name: Render neutral and head turns
        if: ${{ inputs.review == 'neck-motion' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V755_neck_skinning_trial.blend --threads 2 --python-exit-code 1 --python pipeline/render_v755_neck_motion.py
      - name: Bind native neck for body assembly
        if: ${{ inputs.review == 'body-join' }}
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V740_cloud_groom_trial.blend --threads 2 --python-exit-code 1 --python pipeline/build_v755_neck_skinning_trial.py
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/V755_neck_skinning_trial.blend --threads 2 --python-exit-code 1 --python pipeline/build_v757_body_join.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ inputs.review || 'neck-motion' }}-preview
          path: |
            results/*.json
            results/renders/v762*.png
            results/renders/v761*.png
            results/renders/v760*.png
            results/renders/v759*.png
            results/renders/v757*.png
            results/renders/v756*.png
            results/renders/v755*.png
            results/renders/v740_unlit_basecolor*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-neck-checkpoint
          path: |
            results/V757_body_join_trial.blend
            results/V755_neck_skinning_trial.blend
            results/V756_skin_calibration_trial.blend
          retention-days: 7
