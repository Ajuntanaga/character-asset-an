name: Refine character scalp surface coverage
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Visually reviewed surface beard run
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: character-blender-processing
  cancel-in-progress: false
jobs:
  hair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: /tmp/blender-5.2.2-linux-x64
          key: blender-linux-5.2.2-84098912789d
      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 2 -o /tmp/blender.tar.xz https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Download reviewed surface beard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$SOURCE_RUN" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_RUN" --json workflowName --jq .workflowName)" = 'Redistribute character beard on native surface'
          gh run download "$SOURCE_RUN" --name surface-beard-checkpoint --dir source
          mkdir -p results
          mv source/V774_surface_beard_trial.blend results/source.blend
      - name: Build scalp coverage and render three views
        run: |
          /tmp/blender-5.2.2-linux-x64/blender --background --disable-autoexec results/source.blend --threads 2 --python-exit-code 1 --python pipeline/build_v775_surface_scalp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-scalp-preview
          path: |
            results/v775*.json
            results/renders/v775*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: surface-scalp-checkpoint
          path: |
            results/V775_surface_scalp_trial.blend
          retention-days: 14
